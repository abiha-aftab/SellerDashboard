server.port=${PORT:8080}

# In-memory H2 database, re-seeded with demo data on every start
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The H2 web console exposes the whole database, so it is opt-in
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

spring.cache.type=caffeine

# Comma-separated origins allowed to call /api directly (the Vite dev proxy needs none)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

logging.level.org.hibernate.SQL=warn
