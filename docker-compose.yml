services:
  backend:
    build: ./backend
    environment:
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-false}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-5173}:80"
